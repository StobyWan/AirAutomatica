name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd frontend && npm ci && VITE_APP_VERSION="$VERSION" VITE_BASE_PATH=/dashboard npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build wheel
        run: |
          mkdir -p wheel
          pip wheel --no-cache-dir --wheel-dir wheel .

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: airautomatica-wheel
          path: wheel/

  build-deb:
    needs: [build-frontend, build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging
            alembic
            alembic.ini
            pyproject.toml
            README.md
          sparse-checkout-cone-mode: false

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify frontend artifact
        run: |
          echo "Frontend artifact contents:"
          find frontend/dist -type f | head -20
          test -f frontend/dist/index.html || (echo "ERROR: index.html missing" && exit 1)

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: airautomatica-wheel
          path: wheel

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: VERSION="${GITHUB_REF#refs/tags/v}" ./packaging/debian/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: airautomatica-deb
          path: airautomatica_*_all.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: airautomatica_*_all.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
