name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && VITE_BASE_PATH=/dashboard npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-deb:
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Place frontend dist
        run: mkdir -p frontend && mv frontend-dist frontend/dist

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          pip install build
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: ./packaging/debian/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: airautomatica-deb
          path: airautomatica_*_all.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: airautomatica_*_all.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
