name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          pip install build
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: ./packaging/debian/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: airautomatica-deb
          path: airautomatica_*_all.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: airautomatica_*_all.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
