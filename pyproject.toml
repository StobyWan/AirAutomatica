[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airautomatica"
version = "0.1.0"
description = "Companion computer app for Raspberry Pi - MAVLink telemetry from ArduPilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymavlink>=2.4.40",
    "pyserial>=3.5",
    "httpx>=0.27",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.urls]
Repository = "https://github.com/StobyWan/AirAutomatica"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
airautomatica = "airautomatica.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airautomatica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
