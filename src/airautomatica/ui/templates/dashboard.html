<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRAUTOMATICA Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e8e8e8;
      --muted: #a0a0a0;
      --connected: #22c55e;
      --stale: #eab308;
      --disconnected: #ef4444;
      --backoff: #f97316;
      --connecting: #3b82f6;
      --starting: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      font-size: 1rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin: 0 0 1rem 0; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .status-connected { background: var(--connected); color: #000; }
    .status-stale { background: var(--stale); color: #000; }
    .status-disconnected { background: var(--disconnected); color: #fff; }
    .status-backoff { background: var(--backoff); color: #000; }
    .status-connecting { background: var(--connecting); color: #fff; }
    .status-starting { background: var(--starting); color: #fff; }
    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1rem; margin: 0 0 0.75rem 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field label { font-size: 0.75rem; color: var(--muted); }
    .field span { font-family: ui-monospace, monospace; }
    .connection-status { margin-bottom: 1rem; font-size: 0.875rem; color: var(--muted); }
    .detection-item {
      padding: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.875rem;
    }
    .detection-item:last-child { border-bottom: none; }
    .session-item {
      padding: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.875rem;
    }
    .session-item:last-child { border-bottom: none; }
    .na { color: var(--muted); }
  </style>
</head>
<body>
  <h1>AIRAUTOMATICA Dashboard</h1>
  <div class="connection-status" id="connection-status">Connecting…</div>

  <div class="card">
    <h2>System Health</h2>
    <div id="telemetry-status"></div>
    <div id="telemetry-alert" class="hidden mt-2 px-3 py-2 rounded text-sm bg-amber-900/40 text-amber-200 border border-amber-700/50"></div>
    <div class="grid" id="health-fields"></div>
  </div>

  <div class="card">
    <h2>Aircraft State</h2>
    <div class="flex flex-col items-start gap-4">
      <div class="flex flex-col items-center gap-1">
        <div class="relative w-20 h-20 rounded-full border-2 border-gray-500 bg-gray-800/50 flex items-center justify-center">
          <span class="absolute -top-0.5 left-1/2 -translate-x-1/2 text-[10px] font-semibold text-gray-400">N</span>
          <span class="absolute right-0.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-500">E</span>
          <span class="absolute -bottom-0.5 left-1/2 -translate-x-1/2 text-[10px] text-gray-500">S</span>
          <span class="absolute left-0.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-500">W</span>
          <div id="compass-arrow" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-transform duration-150 ease-out" style="transform: rotate(0deg)">
            <svg class="w-7 h-7 drop-shadow-sm" viewBox="0 0 24 24">
              <polygon points="12,2 22,20 2,20" fill="#ef4444"/>
            </svg>
          </div>
        </div>
        <span id="compass-heading" class="text-xs text-gray-400 font-mono">—</span>
      </div>
      <div class="grid w-full" id="state-fields"></div>
    </div>
  </div>

  <div class="card">
    <h2>Recent Detections</h2>
    <div id="detections-list"></div>
  </div>

  <div class="card">
    <h2>Session / Persistence</h2>
    <div class="grid" id="session-fields"></div>
  </div>

  <div class="card">
    <h2>Session History</h2>
    <div id="sessions-list"></div>
  </div>

  <script>
    const socket = io();
    const fmt = (v) => v == null || v === '' ? '<span class="na">—</span>' : String(v);
    const fmtNum = (v) => v == null || (typeof v === 'number' && isNaN(v)) ? '<span class="na">—</span>' : String(v);
    const fmtNumPrec = (v, decimals) => v == null || (typeof v === 'number' && isNaN(v)) ? '<span class="na">—</span>' : Number(v).toFixed(decimals);
    const fmtHeading = (v) => {
      if (v == null || (typeof v === 'number' && isNaN(v))) return '<span class="na">—</span>';
      const n = Number(v);
      if (n < 0 || n > 360 || !isFinite(n) || Math.abs(n) > 1e6) return '<span class="na">—</span>';
      return n.toFixed(0);
    };

    function statusClass(s) {
      const m = { connected: 'status-connected', stale: 'status-stale', disconnected: 'status-disconnected',
        backoff: 'status-backoff', connecting: 'status-connecting', starting: 'status-starting' };
      return m[s] || 'status-starting';
    }

    socket.on('connect', () => {
      document.getElementById('connection-status').textContent = 'Connected';
    });
    socket.on('disconnect', () => {
      document.getElementById('connection-status').textContent = 'Disconnected';
    });

    socket.on('health_update', (d) => {
      const tel = d.telemetry || {};
      const status = tel.telemetry_status || 'disconnected';
      document.getElementById('telemetry-status').innerHTML =
        `<span class="status-badge ${statusClass(status)}">${status}</span>`;
      const alertEl = document.getElementById('telemetry-alert');
      if (status === 'disconnected' || status === 'backoff' || status === 'stale') {
        alertEl.classList.remove('hidden');
        alertEl.textContent = status === 'stale' ? 'Telemetry stale (no recent heartbeat). Unplug FC to see disconnect.' : 'Telemetry disconnected. Unplug FC to see this with real hardware.';
      } else {
        alertEl.classList.add('hidden');
      }
      document.getElementById('health-fields').innerHTML = [
        ['telemetry_backend', d.telemetry_backend],
        ['ai_mode', d.ai_mode],
        ['heartbeat_age_s', tel.heartbeat_age_s != null ? tel.heartbeat_age_s.toFixed(1) + ' s' : null],
        ['reconnect_count', tel.reconnect_count],
        ['last_disconnect_reason', tel.last_disconnect_reason],
      ].map(([k, v]) => `<div class="field"><label>${k}</label><span>${fmt(v)}</span></div>`).join('');
      const p = d.persistence || {};
      document.getElementById('session-fields').innerHTML = [
        ['session_id', d.session_id],
        ['persistence_enabled', p.persistence_enabled],
        ['last_persistence_error', p.last_persistence_error],
      ].map(([k, v]) => `<div class="field"><label>${k}</label><span>${fmt(v)}</span></div>`).join('');
    });

    socket.on('state_update', (d) => {
      const s = d.state;
      if (!s) {
        document.getElementById('state-fields').innerHTML = '<span class="na">No state yet</span>';
        document.getElementById('compass-arrow').style.transform = 'rotate(0deg)';
        document.getElementById('compass-heading').textContent = '—';
        return;
      }
      const stateFields = [
        ['mode', fmt(s.mode)],
        ['lat', fmtNumPrec(s.lat, 6)],
        ['lon', fmtNumPrec(s.lon, 6)],
        ['rel_alt_m', fmtNumPrec(s.rel_alt_m, 1)],
        ['heading_deg', fmtHeading(s.heading_deg)],
        ['voltage_v', fmtNumPrec(s.voltage_v, 2)],
        ['current_a', fmtNumPrec(s.current_a, 2)],
        ['groundspeed_m_s', fmtNumPrec(s.groundspeed_m_s, 1)],
        ['airspeed_m_s', fmtNumPrec(s.airspeed_m_s, 1)],
      ];
      document.getElementById('state-fields').innerHTML = stateFields
        .map(([k, v]) => `<div class="field"><label>${k}</label><span>${v}</span></div>`).join('');

      const heading = s.heading_deg;
      const arrowEl = document.getElementById('compass-arrow');
      const headingEl = document.getElementById('compass-heading');
      if (heading != null && typeof heading === 'number' && !isNaN(heading) && heading >= 0 && heading <= 360 && Math.abs(heading) < 1e6) {
        arrowEl.style.transform = `rotate(${heading}deg)`;
        headingEl.textContent = `${Math.round(heading)}°`;
      } else {
        arrowEl.style.transform = 'rotate(0deg)';
        headingEl.textContent = '—';
      }
    });

    socket.on('detections_update', (d) => {
      const list = d.detections || [];
      const el = document.getElementById('detections-list');
      if (list.length === 0) {
        el.innerHTML = '<span class="na">No detections</span>';
        return;
      }
      el.innerHTML = list.map(d => `
        <div class="detection-item">
          <strong>${fmt(d.label)}</strong> ${(d.confidence != null ? (d.confidence * 100).toFixed(0) + '%' : '')}
          ${d.summary ? ' — ' + d.summary : ''}
        </div>
      `).join('');
    });

    socket.on('sessions_update', (d) => {
      const list = d.sessions || [];
      const currentId = d.current_session_id;
      const el = document.getElementById('sessions-list');
      if (list.length === 0) {
        el.innerHTML = '<span class="na">No sessions</span>';
        return;
      }
      const fmtDate = (s) => {
        if (!s) return '—';
        try {
          const dt = new Date(s);
          return dt.toLocaleString();
        } catch {
          return s;
        }
      };
      el.innerHTML = list.map(s => {
        const isCurrent = s.id === currentId;
        const badge = isCurrent ? '<span class="status-badge status-connecting text-[10px] ml-1">current</span>' : '';
        const ended = s.ended_at ? fmtDate(s.ended_at) : '<span class="na">active</span>';
        return `<div class="session-item">
          <strong>#${s.id}</strong>${badge} — ${s.telemetry_backend} / ${s.ai_backend}
          <div class="text-xs text-gray-500 mt-0.5">Started: ${fmtDate(s.started_at)} · Ended: ${ended}</div>
        </div>`;
      }).join('');
    });
  </script>
</body>
</html>
